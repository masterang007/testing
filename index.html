<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RPCM Production Monitor</title>
    <!-- iOS SETTINGS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RPCM Monitor">
    <!-- ANDROID SETTINGS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'plant-bg': '#0f172a',
                        'plant-card': '#1e293b',
                        'plant-border': '#334155',
                        'accent-primary': '#3b82f6', // Blue
                        'accent-secondary': '#8b5cf6', // Purple
                        'status-ok': '#10b981',
                        'status-warn': '#f59e0b',
                        'status-crit': '#ef4444',
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Prop Types (Required for Recharts UMD) -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>

    <!-- Firebase SDKs (Modular) -->
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = { 
            initializeApp, getApps, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken,
            getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy, writeBatch
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .metric-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        input[type="file"]::file-selector-button {
            background-color: #334155;
            color: #e2e8f0;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            margin-right: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        input[type="file"]::file-selector-button:hover { background-color: #475569; }
        
        .custom-checkbox { accent-color: #3b82f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;
        const { 
            LineChart, Line, AreaChart, Area, BarChart, Bar, XAxis, YAxis, CartesianGrid, 
            Tooltip, ResponsiveContainer, ReferenceLine, Legend, ComposedChart
        } = Recharts;

        // --- Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyDjaJHzh_EzVbN_WQvamcL9VnI92R02d7w",
            authDomain: "dashboard-fced7.firebaseapp.com",
            projectId: "dashboard-fced7",
            storageBucket: "dashboard-fced7.firebasestorage.app",
            messagingSenderId: "893864259222",
            appId: "1:893864259222:web:7b82f4dd617f36df661cb7"
        };
        const getAppId = () => typeof __app_id !== 'undefined' ? __app_id : 'dashboard-fced7';

        // --- Icons ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Factory: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 22h20V2l-7 9V7l-6 9V8L2 22z"/></svg>,
                Zap: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
                Activity: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>,
                Droplets: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>,
                LayoutDashboard: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
                Table2: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>,
                Settings: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
                Upload: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
                LogOut: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
                Fuel: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 22v-8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8"/><path d="M8 12V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v8"/></svg>,
                Calendar: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
            };
            return icons[name] || icons.Activity;
        };

        // --- Mappings ---
        const PARAM_MAPPING_PROD = {
            'CTA Production': { cat: 'production', id: 'cta_prod' },
            'PTA Production': { cat: 'production', id: 'pta_prod' },
            'Availability': { cat: 'production', id: 'availability' },
            'Total Power': { cat: 'utility', id: 'total_power' },
            'HAc Consum': { cat: 'utility', id: 'hac_consum' },
            'Natural Gas': { cat: 'utility', id: 'nat_gas' },
            'CMB Catalyst': { cat: 'utility', id: 'cmb_cat' },
            'Equiv. CMB Recovery': { cat: 'utility', id: 'cmb_rec' },
            'Caustic (NaOH)': { cat: 'utility', id: 'caustic' }
        };

        const initialDailySummary = { production: [], utility: [], mtd: [] };
        const initialHourlyData = [];

        // --- Components ---

        const StatCard = ({ title, value, unit, target, icon, trend }) => (
            <div className="metric-card rounded-xl p-5 relative overflow-hidden group">
                <div className="absolute top-0 right-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity">
                    <Icon name={icon} size={60} />
                </div>
                <div className="relative z-10">
                    <div className="text-sm text-gray-400 font-medium mb-1 flex items-center gap-2">
                        <Icon name={icon} size={16} className="text-accent-primary" />
                        {title}
                    </div>
                    <div className="flex items-end gap-2">
                        <span className="text-2xl font-bold text-white">{value}</span>
                        <span className="text-xs text-gray-500 mb-1">{unit}</span>
                    </div>
                    {target && (
                        <div className="mt-2 pt-2 border-t border-white/5 flex justify-between items-center text-xs">
                            <span className="text-gray-500">Target</span>
                            <span className="font-mono text-accent-secondary">{target}</span>
                        </div>
                    )}
                </div>
            </div>
        );

        const PasswordGate = ({ onLogin }) => {
            const [password, setPassword] = useState('');
            const [remember, setRemember] = useState(false);
            const [error, setError] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (password === 'rpcm2024') { 
                    onLogin(remember);
                } else {
                    setError(true);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-plant-bg p-4">
                    <div className="glass-panel p-8 rounded-2xl w-full max-w-md relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-accent-primary to-accent-secondary"></div>
                        <div className="flex justify-center mb-6">
                            <div className="w-16 h-16 bg-accent-primary/20 rounded-2xl flex items-center justify-center text-accent-primary">
                                <Icon name="Factory" size={32} />
                            </div>
                        </div>
                        <h1 className="text-2xl font-bold text-center mb-2 text-white">RPCM Monitor</h1>
                        <p className="text-gray-400 text-center mb-8 text-sm">Secure Access Portal</p>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <input
                                type="password"
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                placeholder="Access Code"
                                className="w-full bg-plant-bg border border-plant-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-accent-primary transition-colors placeholder-gray-600"
                                autoFocus
                            />
                            <div className="flex items-center">
                                <input 
                                    id="remember-me" 
                                    type="checkbox" 
                                    checked={remember}
                                    onChange={(e) => setRemember(e.target.checked)}
                                    className="w-4 h-4 text-accent-primary bg-gray-700 border-gray-600 rounded focus:ring-accent-primary focus:ring-2 custom-checkbox cursor-pointer" 
                                />
                                <label htmlFor="remember-me" className="ml-2 text-sm font-medium text-gray-400 cursor-pointer select-none">Keep me logged in (30 days)</label>
                            </div>
                            {error && <p className="text-status-crit text-sm text-center bg-status-crit/10 py-2 rounded">Invalid credential provided</p>}
                            <button type="submit" className="w-full bg-accent-primary hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-blue-900/20">
                                Enter Dashboard
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const Settings = ({ user, db, appId }) => {
            const [uploading, setUploading] = useState(false);
            const [status, setStatus] = useState('');
            const [selectedFile, setSelectedFile] = useState(null);

            const parseCSVLine = (text) => {
                const results = [];
                let entry = [];
                let inQuote = false;
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    if (char === '"') { inQuote = !inQuote; } 
                    else if (char === ',' && !inQuote) { results.push(entry.join('')); entry = []; } 
                    else { entry.push(char); }
                }
                results.push(entry.join(''));
                return results;
            };

            const handleUpload = async () => {
                if (!user || !db) { setStatus("Error: Database not connected."); return; }
                if (!selectedFile) { setStatus("Please select a CSV file."); return; }

                setUploading(true);
                setStatus('Processing file...');

                try {
                    const batch = window.firebaseModules.writeBatch(db);
                    const publicDataPath = `artifacts/${appId}/public/data`;
                    let updatesCount = 0;

                    const text = await selectedFile.text();
                    const lines = text.split('\n').filter(l => l.trim().length > 0);
                    
                    let isMTDSection = false;

                    for (let i = 1; i < lines.length; i++) {
                        const row = parseCSVLine(lines[i]);
                        
                        // 1. Process Daily Summary (Left Side)
                        // Prod_Report.csv layout: Param(0), Tag(1), Unit(2), Target(3), Actual(4)
                        if (row.length >= 5) {
                            let paramName = row[0]?.trim();
                            
                            // Detect Section Switches
                            if (paramName && paramName.includes('MONTH-TO-DATE')) {
                                isMTDSection = true;
                                continue;
                            } else if (paramName && paramName.includes('TODAY PRODUCTION')) {
                                isMTDSection = false;
                                continue;
                            }

                            let mapping = PARAM_MAPPING_PROD[paramName];
                            let category = 'utility';
                            let idPrefix = '';

                            if (isMTDSection && mapping) {
                                category = 'mtd';
                                idPrefix = 'mtd_';
                            } else if (mapping) {
                                category = mapping.cat;
                            }

                            // CLEANING: Convert "No Good Data" to 0
                            const clean = (val) => {
                                if (!val) return '';
                                if (val.includes('No Good Data') || val.includes('Bad') || val.includes('[-11059]')) return '0';
                                return val.replace(/"/g, '').replace(/,/g, '');
                            };

                            const rawTarget = clean(row[3]);
                            const rawActual = clean(row[4]);

                            if (mapping && (rawActual || rawTarget)) {
                                const docId = idPrefix + mapping.id;
                                const docRef = window.firebaseModules.doc(db, publicDataPath, 'daily_summary', docId);
                                batch.set(docRef, {
                                    id: docId,
                                    category: category,
                                    name: paramName,
                                    unit: row[2]?.trim(),
                                    target: rawTarget,
                                    value: rawActual
                                });
                                updatesCount++;
                            }
                        }

                        // 2. Process Hourly Logs (Right Side)
                        // Time at Col 7. Data starts Col 8.
                        if (row.length > 7) {
                            const timeVal = row[7]?.trim();
                            // Parse "DD/MM/YYYY h AM/PM" or similar
                            if (timeVal && (timeVal.includes(':') || timeVal.includes('AM') || timeVal.includes('PM'))) {
                                // For Doc ID, use a sequential index or sanitize the time string
                                const docId = `log_${timeVal.replace(/[^a-zA-Z0-9]/g, '')}`;

                                const pFloat = (idx) => {
                                    if (idx >= row.length) return 0;
                                    let val = row[idx]?.trim();
                                    if (!val || val.includes('No Good') || val.includes('Bad') || val.includes('[-11059]')) return 0;
                                    val = val.replace(/"/g, '').replace(/,/g, '');
                                    return parseFloat(val) || 0;
                                };

                                const logObj = {
                                    time: timeVal, 
                                    plant_power: pFloat(8),
                                    stg_gen: pFloat(9)
                                    // Removed Area Distribution fields as requested (ISBL, OSBL, etc.)
                                };
                                
                                const docRef = window.firebaseModules.doc(db, publicDataPath, 'hourly_logs', docId);
                                batch.set(docRef, logObj);
                                updatesCount++;
                            }
                        }
                    }

                    await batch.commit();
                    setStatus(`Success! Synced ${updatesCount} data points.`);
                    setSelectedFile(null);
                    document.getElementById('file-upload').value = "";

                } catch (err) {
                    console.error(err);
                    setStatus('Upload failed: ' + err.message);
                } finally {
                    setUploading(false);
                }
            };

            return (
                <div className="p-6 md:p-10 md:ml-64 text-white">
                    <h1 className="text-3xl font-bold mb-8">Settings & Data</h1>
                    <div className="glass-panel p-8 rounded-2xl max-w-3xl">
                        <div className="flex items-center gap-4 mb-6">
                            <div className="p-3 bg-accent-primary/20 rounded-lg text-accent-primary">
                                <Icon name="Upload" size={24} />
                            </div>
                            <div>
                                <h2 className="text-xl font-bold">Report Upload</h2>
                                <p className="text-gray-400 text-sm">Sync dashboard with 'Prod_Report.csv'</p>
                            </div>
                        </div>
                        
                        <div className="bg-plant-bg/50 p-6 rounded-xl border border-plant-border border-dashed">
                            <label className="block text-sm font-medium text-gray-300 mb-4">Select CSV File</label>
                            <div className="flex flex-col sm:flex-row gap-4">
                                <input 
                                    id="file-upload"
                                    type="file" 
                                    accept=".csv"
                                    onChange={(e) => setSelectedFile(e.target.files[0])}
                                    className="flex-1 block w-full text-sm text-gray-400 file:mr-4 file:py-3 file:px-6 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-plant-card file:text-white hover:file:bg-plant-border cursor-pointer"
                                />
                                <button 
                                    onClick={handleUpload} 
                                    disabled={uploading || !selectedFile}
                                    className={`px-8 py-3 rounded-lg font-bold transition-all flex items-center justify-center gap-2 ${
                                        uploading || !selectedFile
                                        ? 'bg-gray-700 text-gray-500 cursor-not-allowed' 
                                        : 'bg-accent-primary hover:bg-blue-600 text-white shadow-lg shadow-blue-900/20'
                                    }`}
                                >
                                    {uploading ? 'Syncing...' : 'Upload'}
                                </button>
                            </div>
                        </div>
                        
                        {status && (
                            <div className={`mt-6 p-4 rounded-lg text-sm font-medium flex items-center gap-2 ${status.includes('Error') || status.includes('failed') ? 'bg-status-crit/10 text-status-crit' : 'bg-status-ok/10 text-status-ok'}`}>
                                {status}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Dashboard = ({ dailyData, hourlyData }) => {
            const getVal = (cat, id) => {
                const item = dailyData[cat]?.find(x => x.id === id);
                return item ? item.value : '-';
            };
            const getTarget = (cat, id) => {
                const item = dailyData[cat]?.find(x => x.id === id);
                return item ? item.target : '-';
            };
            const getUnit = (cat, id) => {
                const item = dailyData[cat]?.find(x => x.id === id);
                return item ? item.unit : '';
            };

            const latestTime = useMemo(() => {
                if (!hourlyData || hourlyData.length === 0) return "No Data";
                // Taking last entry; CSV parsing should ideally add sequence or proper date
                const lastLog = hourlyData[hourlyData.length - 1];
                return lastLog.time || "";
            }, [hourlyData]);

            return (
                <div className="p-4 md:p-8 space-y-8 pb-24 md:ml-64">
                    {/* Header */}
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-white tracking-tight">Production Overview</h1>
                            <p className="text-gray-400 mt-1 flex items-center gap-2 text-sm">
                                <span className="w-2 h-2 rounded-full bg-status-ok animate-pulse"></span>
                                Data synchronized: {latestTime}
                            </p>
                        </div>
                    </div>

                    {/* 1. Top Row: Key Production KPIs */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <StatCard 
                            title="CTA Production" 
                            value={getVal('production', 'cta_prod')} 
                            unit={getUnit('production', 'cta_prod')}
                            target={getTarget('production', 'cta_prod')}
                            icon="Factory" 
                        />
                        <StatCard 
                            title="PTA Production" 
                            value={getVal('production', 'pta_prod')} 
                            unit={getUnit('production', 'pta_prod')}
                            target={getTarget('production', 'pta_prod')}
                            icon="Factory" 
                        />
                        <StatCard 
                            title="Plant Availability" 
                            value={getVal('production', 'availability')} 
                            unit={getUnit('production', 'availability')}
                            target={getTarget('production', 'availability')}
                            icon="Activity" 
                        />
                    </div>

                    {/* 2. Charts Row (Expanded) */}
                    <div className="glass-panel p-6 rounded-2xl">
                        <h3 className="text-lg font-semibold mb-6 flex items-center gap-2">
                            <Icon name="Zap" className="text-yellow-400" />
                            Power Generation vs Consumption
                        </h3>
                        <div className="h-96">
                            <ResponsiveContainer width="100%" height="100%">
                                <AreaChart data={hourlyData}>
                                    <defs>
                                        <linearGradient id="gradPower" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="5%" stopColor="#eab308" stopOpacity={0.3}/>
                                            <stop offset="95%" stopColor="#eab308" stopOpacity={0}/>
                                        </linearGradient>
                                        <linearGradient id="gradGen" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/>
                                            <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
                                        </linearGradient>
                                    </defs>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                    <XAxis dataKey="time" stroke="#94a3b8" fontSize={10} tickLine={false} interval={2} />
                                    <YAxis stroke="#94a3b8" fontSize={11} tickLine={false} />
                                    <Tooltip 
                                        contentStyle={{backgroundColor: '#1e293b', border: '1px solid #334155', borderRadius: '8px'}}
                                        itemStyle={{color: '#f1f5f9'}}
                                    />
                                    <Legend />
                                    <Area type="monotone" dataKey="plant_power" name="Plant Power (MW)" stroke="#eab308" fill="url(#gradPower)" strokeWidth={2} />
                                    <Area type="monotone" dataKey="stg_gen" name="STG Gen (MW)" stroke="#3b82f6" fill="url(#gradGen)" strokeWidth={2} />
                                </AreaChart>
                            </ResponsiveContainer>
                        </div>
                    </div>

                    {/* 3. Utilities & Consumption Grid (Today) */}
                    <div className="glass-panel p-6 rounded-2xl">
                        <h3 className="text-lg font-semibold mb-6 flex items-center gap-2">
                            <Icon name="Droplets" className="text-cyan-400" />
                            Daily Usage & Efficiency (Today)
                        </h3>
                        <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
                            {[
                                { id: 'total_power', label: 'Total Power', icon: 'Zap', color: 'text-yellow-400' },
                                { id: 'hac_consum', label: 'HAc Consum', icon: 'Droplets', color: 'text-cyan-400' },
                                { id: 'nat_gas', label: 'Natural Gas', icon: 'Fuel', color: 'text-green-400' },
                                { id: 'caustic', label: 'Caustic', icon: 'Activity', color: 'text-pink-400' },
                                { id: 'cmb_cat', label: 'CMB Catalyst', icon: 'Factory', color: 'text-indigo-400' },
                                { id: 'cmb_rec', label: 'CMB Recovery', icon: 'Activity', color: 'text-orange-400' },
                            ].map(metric => (
                                <div key={metric.id} className="bg-plant-bg/50 p-4 rounded-xl border border-plant-border">
                                    <div className={`text-xs font-medium mb-1 ${metric.color} flex items-center gap-1`}>
                                        <Icon name={metric.icon} size={12} />
                                        {metric.label}
                                    </div>
                                    <div className="text-xl font-bold text-white mb-1">
                                        {getVal('utility', metric.id)}
                                    </div>
                                    <div className="text-xs text-gray-500">
                                        Target: <span className="text-gray-300 font-mono">{getTarget('utility', metric.id)}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 4. Month-to-Date Grid */}
                    <div className="glass-panel p-6 rounded-2xl">
                        <h3 className="text-lg font-semibold mb-6 flex items-center gap-2">
                            <Icon name="Calendar" className="text-orange-400" />
                            Month-To-Date Performance
                        </h3>
                        <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
                            {[
                                { id: 'mtd_total_power', label: 'Total Power', icon: 'Zap', color: 'text-yellow-400', key: 'total_power' },
                                { id: 'mtd_hac_consum', label: 'HAc Consum', icon: 'Droplets', color: 'text-cyan-400', key: 'hac_consum' },
                                { id: 'mtd_nat_gas', label: 'Natural Gas', icon: 'Fuel', color: 'text-green-400', key: 'nat_gas' },
                                { id: 'mtd_caustic', label: 'Caustic', icon: 'Activity', color: 'text-pink-400', key: 'caustic' },
                                { id: 'mtd_cmb_cat', label: 'CMB Catalyst', icon: 'Factory', color: 'text-indigo-400', key: 'cmb_cat' },
                                { id: 'mtd_cmb_rec', label: 'CMB Recovery', icon: 'Activity', color: 'text-orange-400', key: 'cmb_rec' },
                            ].map(metric => (
                                <div key={metric.id} className="bg-plant-bg/50 p-4 rounded-xl border border-plant-border">
                                    <div className={`text-xs font-medium mb-1 ${metric.color} flex items-center gap-1`}>
                                        <Icon name={metric.icon} size={12} />
                                        {metric.label}
                                    </div>
                                    <div className="text-xl font-bold text-white mb-1">
                                        {getVal('mtd', metric.key)}
                                    </div>
                                    <div className="text-xs text-gray-500">
                                        Target: <span className="text-gray-300 font-mono">{getTarget('mtd', metric.key)}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const Sidebar = ({ activeTab, onTabChange, onLogout }) => {
            const items = [
                { id: 'dashboard', icon: 'LayoutDashboard', label: 'Dashboard' },
                { id: 'logs', icon: 'Table2', label: 'Hourly Logs' },
                { id: 'settings', icon: 'Settings', label: 'Settings' },
            ];

            return (
                <div className="w-64 border-r border-plant-border flex-col bg-plant-card fixed h-full z-10 hidden md:flex">
                    <div className="p-8 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-accent-primary to-accent-secondary rounded-lg flex items-center justify-center text-white font-bold shadow-lg shadow-blue-900/20">R</div>
                        <div>
                            <h1 className="font-bold text-xl tracking-tight text-white">RPCM</h1>
                            <div className="text-xs text-gray-500">Production View</div>
                        </div>
                    </div>
                    <nav className="flex-1 px-4 space-y-2 mt-4">
                        {items.map(item => (
                            <button
                                key={item.id}
                                onClick={() => onTabChange(item.id)}
                                className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-medium ${
                                    activeTab === item.id 
                                    ? 'bg-accent-primary text-white shadow-lg shadow-blue-900/20' 
                                    : 'text-gray-400 hover:bg-plant-border/50 hover:text-white'
                                }`}
                            >
                                <Icon name={item.icon} size={20} />
                                <span>{item.label}</span>
                            </button>
                        ))}
                    </nav>
                    <div className="p-6">
                        <button 
                            onClick={onLogout}
                            className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 transition-colors text-sm font-medium"
                        >
                            <Icon name="LogOut" size={18} />
                            <span>Sign Out</span>
                        </button>
                    </div>
                </div>
            );
        };

        const BottomNav = ({ activeTab, onTabChange }) => {
            const items = [
                { id: 'dashboard', icon: 'LayoutDashboard', label: 'Dash' },
                { id: 'logs', icon: 'Table2', label: 'Logs' },
                { id: 'settings', icon: 'Settings', label: 'Setup' },
            ];

            return (
                <div className="fixed bottom-0 left-0 right-0 bg-plant-card border-t border-plant-border flex justify-around p-2 z-50 md:hidden safe-area-pb shadow-2xl">
                    {items.map(item => (
                        <button
                            key={item.id}
                            onClick={() => onTabChange(item.id)}
                            className={`flex flex-col items-center justify-center w-full py-2 rounded-lg transition-all ${
                                activeTab === item.id 
                                ? 'text-accent-primary' 
                                : 'text-gray-500 hover:text-gray-300'
                            }`}
                        >
                            <Icon name={item.icon} size={22} />
                            <span className="text-[10px] mt-1 font-medium">{item.label}</span>
                        </button>
                    ))}
                </div>
            );
        };

        // Main App Component
        const App = () => {
            // Safe Auth Logic
            const [authenticated, setAuthenticated] = useState(() => {
                try {
                    const stored = localStorage.getItem('rpcm_auth_data');
                    if (stored) {
                        const { timestamp } = JSON.parse(stored);
                        if (Date.now() - timestamp < 2592000000) return true;
                    }
                    return !!sessionStorage.getItem('rpcm_authenticated');
                } catch { return false; }
            });
            
            const [activeTab, setActiveTab] = useState('dashboard');
            const [user, setUser] = useState(null);
            const [firebaseReady, setFirebaseReady] = useState(false);
            
            // Data State
            const [dailyData, setDailyData] = useState(initialDailySummary);
            const [hourlyData, setHourlyData] = useState(initialHourlyData);

            useEffect(() => {
                const checkFirebase = () => { if (window.firebaseModules) setFirebaseReady(true); };
                window.addEventListener('firebase-ready', checkFirebase);
                checkFirebase();
                return () => window.removeEventListener('firebase-ready', checkFirebase);
            }, []);

            useEffect(() => {
                if (!firebaseReady) return;
                const { initializeApp, getApps, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } = window.firebaseModules;
                try {
                    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
                    const auth = getAuth(app);
                    const initAuth = async () => {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            try { await signInWithCustomToken(auth, __initial_auth_token); return; } 
                            catch (e) { console.warn("Token failed, fallback anon"); }
                        }
                        await signInAnonymously(auth);
                    };
                    initAuth();
                    return onAuthStateChanged(auth, (u) => setUser(u));
                } catch (e) { console.error("Auth Error", e); }
            }, [firebaseReady]);

            useEffect(() => {
                if (!user || !firebaseReady) return;
                const { getFirestore, collection, onSnapshot, query, orderBy } = window.firebaseModules;
                const db = getFirestore();
                const appId = getAppId();
                const publicDataPath = `artifacts/${appId}/public/data`;

                const unsubSummary = onSnapshot(query(collection(db, publicDataPath, 'daily_summary')), (snap) => {
                    if (snap.empty) return;
                    const map = { production: [], utility: [], mtd: [] };
                    snap.forEach(doc => {
                        const d = doc.data();
                        if (map[d.category]) map[d.category].push(d);
                    });
                    setDailyData(prev => ({...prev, ...map}));
                });

                const unsubLogs = onSnapshot(query(collection(db, publicDataPath, 'hourly_logs'), orderBy('time')), (snap) => {
                    if (snap.empty) return;
                    const logs = [];
                    snap.forEach(doc => logs.push(doc.data()));
                    setHourlyData(logs);
                });

                return () => { unsubSummary(); unsubLogs(); };
            }, [user, firebaseReady]);
            
            const handleLogout = () => {
                try { localStorage.removeItem('rpcm_auth_data'); sessionStorage.removeItem('rpcm_authenticated'); } catch(e){}
                setAuthenticated(false);
            };
            
            const handleLogin = (remember) => {
                try {
                    if (remember) localStorage.setItem('rpcm_auth_data', JSON.stringify({ timestamp: Date.now() }));
                    else sessionStorage.setItem('rpcm_authenticated', 'true');
                } catch(e){}
                setAuthenticated(true);
            }

            if (!authenticated) return <PasswordGate onLogin={handleLogin} />;
            
            const dbInstance = firebaseReady && window.firebaseModules ? window.firebaseModules.getFirestore() : null;
            
            return (
                <div className="min-h-screen bg-plant-bg text-slate-200 selection:bg-accent-primary selection:text-white">
                    <Sidebar activeTab={activeTab} onTabChange={setActiveTab} onLogout={handleLogout} />
                    <BottomNav activeTab={activeTab} onTabChange={setActiveTab} />
                    
                    {activeTab === 'dashboard' && <Dashboard dailyData={dailyData} hourlyData={hourlyData} />}
                    {activeTab === 'logs' && (
                        <div className="p-4 md:p-8 md:ml-64 text-center text-gray-500 mt-10 md:mt-20">
                            <h2 className="text-2xl font-bold text-white mb-6">Hourly Log Data</h2>
                            <div className="glass-panel p-4 rounded-xl overflow-x-auto">
                                <table className="w-full text-sm text-left whitespace-nowrap">
                                    <thead className="text-xs text-gray-400 uppercase bg-plant-border/50">
                                        <tr>
                                            <th className="px-6 py-4 rounded-tl-lg">Time</th>
                                            <th className="px-6 py-4">Plant Power</th>
                                            <th className="px-6 py-4 rounded-tr-lg">STG Gen</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-plant-border">
                                        {hourlyData.map((row, i) => (
                                            <tr key={i} className="hover:bg-white/5 transition-colors">
                                                <td className="px-6 py-4 font-mono text-accent-primary">{row.time}</td>
                                                <td className="px-6 py-4">{row.plant_power}</td>
                                                <td className="px-6 py-4">{row.stg_gen}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                    {activeTab === 'settings' && <Settings user={user} db={dbInstance} appId={getAppId()} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        class SafeRoot extends React.Component {
            state = { hasError: false };
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) return (
                    <div className="min-h-screen bg-plant-bg flex items-center justify-center text-center p-4">
                        <div>
                            <h2 className="text-2xl font-bold text-status-crit mb-2">Critical Error</h2>
                            <button onClick={() => { localStorage.clear(); sessionStorage.clear(); window.location.reload(); }} className="bg-plant-border px-6 py-2 rounded-lg hover:bg-white/10 transition">Reset App</button>
                        </div>
                    </div>
                );
                return this.props.children;
            }
        }
        root.render(<SafeRoot><App /></SafeRoot>);
    </script>
</body>
</html>
