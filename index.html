<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RPCM Production Monitor</title>
    <!-- iOS SETTINGS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RPCM Monitor">
    <!-- ANDROID SETTINGS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'plant-bg': '#0f172a',
                        'plant-card': '#1e293b',
                        'plant-border': '#334155',
                        'accent-primary': '#3b82f6', // Blue
                        'accent-secondary': '#8b5cf6', // Purple
                        'status-ok': '#10b981',
                        'status-warn': '#f59e0b',
                        'status-crit': '#ef4444',

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Prop Types (Required for Recharts UMD) -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
    <!-- Firebase SDKs (Modular) -->
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        window.firebaseModules = { 
            initializeApp, getApps, getAuth, signInAnonymously, onAuthStateChanged,
            getFirestore, collection, onSnapshot, query, orderBy
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .metric-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        input[type="file"]::file-selector-button {
            background-color: #334155;
            color: #e2e8f0;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            margin-right: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        input[type="file"]::file-selector-button:hover { background-color: #475569; }
        .custom-checkbox { accent-color: #3b82f6; }
        .chart-tooltip {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px;
            color: #f1f5f9;
        }
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .time-badge {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
    </style>
</head>

        // --- Configuration ---
        const firebaseConfig = {

                LayoutDashboard: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
                Table2: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>,
                Settings: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
                Upload: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
                LogOut: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
                Fuel: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 22v-8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8"/><path d="M8 12V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v8"/></svg>,
                Calendar: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
                AlertTriangle: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r="1"/></svg>,
                RefreshCw: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
                Clock: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
                Download: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
                Eye: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
                EyeOff: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            };
            return icons[name] || icons.Activity;
        };
        
        // --- Helper Functions ---
        const formatNumber = (value, decimals = 2) => {
            if (value === null || value === undefined || value === '') return '-';
            if (typeof value === 'string' && (value.includes('No Good Data') || value.includes('Bad') || value.includes('Resize'))) return '-';
            
            let num = parseFloat(value);
            if (isNaN(num)) return '-';
            
            return num.toFixed(decimals);
        };
        
        const parseTime = (timeStr) => {
            if (!timeStr) return "00:00";
            
            // Handle full datetime format: "2025-11-27 14:20:44.890000"
            if (timeStr.includes('-') && timeStr.includes(':')) {
                try {
                    const date = new Date(timeStr);
                    if (!isNaN(date.getTime())) {
                        return date.toLocaleTimeString('en-US', { 
                            hour: '2-digit', 
                            minute: '2-digit',
                            hour12: true 
                        });
                    }
                } catch (e) {
                    // Fallback to other formats
                }
            }
            
            // Handle time strings with AM/PM
            if (timeStr.includes('AM') || timeStr.includes('PM')) {
                return timeStr.replace(/(\d+:\d+)(:\d+)?\s*(AM|PM)/i, '$1 $3');
            }
            
            // Handle 24-hour format
            if (timeStr.includes(':')) {
                const parts = timeStr.split(':');
                if (parts.length >= 2) {
                    const hour = parseInt(parts[0]);
                    const minute = parseInt(parts[1]);
                    const ampm = hour >= 12 ? 'PM' : 'AM';
                    const displayHour = hour % 12 || 12;
                    return `${displayHour}:${minute.toString().padStart(2, '0')} ${ampm}`;
                }
            }
            
            return timeStr;
        };
        
        // --- Components ---
        const StatCard = ({ title, value, unit, target, icon, loading = false }) => {
            if (loading) {
                return (
                    <div className="metric-card rounded-xl p-5 skeleton"></div>
                );
            }
            
            // Determine status color based on value vs target
            let statusColor = 'text-gray-400';
            const numValue = parseFloat(value);
            const numTarget = parseFloat(target);
            
            if (!isNaN(numValue) && !isNaN(numTarget)) {
                if (title.includes('Availability') || title.includes('Recovery')) {
                    // Higher is better
                    if (numValue >= numTarget) statusColor = 'text-status-ok';
                    else if (numValue >= numTarget * 0.9) statusColor = 'text-status-warn';
                    else statusColor = 'text-status-crit';
                } else {
                    // Lower is better (consumption metrics)
                    if (numValue <= numTarget) statusColor = 'text-status-ok';
                    else if (numValue <= numTarget * 1.1) statusColor = 'text-status-warn';
                    else statusColor = 'text-status-crit';
                }
            }
            
            return (
                <div className="metric-card rounded-xl p-5 relative overflow-hidden group">
                    <div className="absolute top-0 right-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity">
                        <Icon name={icon} size={60} />
                    </div>
                    <div className="relative z-10">
                        <div className="text-sm text-gray-400 font-medium mb-1 flex items-center gap-2">
                            <Icon name={icon} size={16} className="text-accent-primary" />
                            {title}
                        </div>
                        <div className="flex items-end gap-2">
                            <span className="text-2xl font-bold text-white">{formatNumber(value)}</span>
                            {unit && <span className="text-xs text-gray-500 mb-1">{unit}</span>}
                        </div>
                        {target && (
                            <div className="mt-2 pt-2 border-t border-white/5 flex justify-between items-center text-xs">
                                <span className="text-gray-500 flex items-center">
                                    <span className={`status-indicator ${statusColor.replace('text-', 'bg-')}`}></span>
                                    Target: {formatNumber(target)}
                                </span>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        
        const PasswordGate = ({ onLogin }) => {
            const [password, setPassword] = useState('');
            const [remember, setRemember] = useState(false);
            const [error, setError] = useState(false);
            const [showPassword, setShowPassword] = useState(false);
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (password === 'rpcm2024') { 
                    onLogin(remember);
                    setError(false);
                } else {
                    setError(true);
                    setPassword('');
                }
            };
            
            return (
                <div className="min-h-screen flex items-center justify-center bg-plant-bg p-4">
                    <div className="glass-panel p-8 rounded-2xl w-full max-w-md relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-accent-primary to-accent-secondary"></div>
                        <div className="flex justify-center mb-6">
                            <div className="w-16 h-16 bg-accent-primary/20 rounded-2xl flex items-center justify-center text-accent-primary">
                                <Icon name="Factory" size={32} />
                            </div>
                        </div>
                        <h1 className="text-2xl font-bold text-center mb-2 text-white">RPCM Monitor</h1>
                        <p className="text-gray-400 text-center mb-8 text-sm">Secure Access Portal</p>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div className="relative">
                                <input
                                    type={showPassword ? "text" : "password"}
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    placeholder="Access Code"
                                    className="w-full bg-plant-bg border border-plant-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-accent-primary transition-colors placeholder-gray-600"
                                    autoFocus
                                />
                                <button
                                    type="button"
                                    onClick={() => setShowPassword(!showPassword)}
                                    className="absolute right-3 top-3 text-gray-400 hover:text-white transition-colors"
                                    aria-label={showPassword ? "Hide password" : "Show password"}
                                >
                                    <Icon name={showPassword ? "EyeOff" : "Eye"} size={18} />
                                </button>
                            </div>
                            <div className="flex items-center">
                                <input 
                                    id="remember-me" 
                                    type="checkbox" 
                                    checked={remember}
                                    onChange={(e) => setRemember(e.target.checked)}
                                    className="w-4 h-4 text-accent-primary bg-gray-700 border-gray-600 rounded focus:ring-accent-primary focus:ring-2 custom-checkbox cursor-pointer" 
                                />
                                <label htmlFor="remember-me" className="ml-2 text-sm font-medium text-gray-400 cursor-pointer select-none">Keep me logged in (30 days)</label>
                            </div>
                            {error && <p className="text-status-crit text-sm text-center bg-status-crit/10 py-2 rounded">Invalid credential provided</p>}
                            <button type="submit" className="w-full bg-accent-primary hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-blue-900/20">
                                Enter Dashboard
                            </button>
                        </form>
                    </div>
                </div>
            );
        };
        
        const Settings = ({ user, db }) => {
            const [uploading, setUploading] = useState(false);
            const [status, setStatus] = useState('');
            const [selectedFile, setSelectedFile] = useState(null);
            const [dataPreview, setDataPreview] = useState(null);
            const [error, setError] = useState(null);
            
            const handleFileChange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                setSelectedFile(file);
                setStatus('');
                setError(null);
                setDataPreview(null);
                
                try {
                    const text = await file.text();
                    const lines = text.split('\n').filter(l => l.trim().length > 0);
                    
                    if (lines.length < 2) {
                        setError('Invalid CSV file format');
                        return;
                    }
                    
                    // Parse CSV format
                    const rows = lines.slice(1, 7).map(line => {
                        const values = line.split(',');
                        return values.map(val => val.replace(/^"|"$/g, '').trim());
                    });
                    
                    setDataPreview(rows);
                    setStatus(`File loaded: ${rows.length} data rows detected`);
                } catch (err) {
                    setError('Error reading file: ' + err.message);
                    console.error(err);
                }
            };
            
            const handleUpload = async () => {
                // This is a client-side only dashboard - actual uploads must be done by the Python script
                setStatus('This dashboard reads data from Firestore. Please use the Python upload script to update data.');
                setTimeout(() => setStatus(''), 5000);
            };
            
            return (
                <div className="p-4 md:p-6 md:ml-64 text-white min-h-screen">
                    <h1 className="text-2xl md:text-3xl font-bold mb-6">Settings & Data Management</h1>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Upload Panel */}
                        <div className="glass-panel p-6 rounded-2xl">
                            <div className="flex items-center gap-3 mb-5">
                                <div className="p-2 bg-accent-primary/20 rounded-lg text-accent-primary">
                                    <Icon name="Upload" size={24} />
                                </div>
                                <h2 className="text-xl font-bold">Data Upload (Read Only)</h2>
                            </div>
                            
                            <div className="space-y-4">
                                <div className="bg-plant-bg/50 p-4 rounded-xl border border-plant-border border-dashed">
                                    <label className="block text-sm font-medium text-gray-300 mb-2">Select CSV File (Preview Only)</label>
                                    <input 
                                        id="file-upload"
                                        type="file" 
                                        accept=".csv"
                                        onChange={handleFileChange}
                                        className="w-full text-sm text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-plant-card file:text-gray-200 hover:file:bg-plant-border cursor-pointer"
                                    />
                                </div>
                                
                                {dataPreview && (
                                    <div className="mt-4">
                                        <h3 className="text-sm font-medium text-gray-400 mb-2">Data Preview</h3>
                                        <div className="overflow-x-auto rounded-lg border border-plant-border max-h-64">
                                            <table className="w-full text-sm">
                                                <thead className="bg-plant-border/30">
                                                    <tr>
                                                        <th className="px-3 py-2 text-left">Parameter</th>
                                                        <th className="px-3 py-2 text-left">Unit</th>
                                                        <th className="px-3 py-2 text-left">Target</th>
                                                        <th className="px-3 py-2 text-left">Actual</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {dataPreview.map((row, idx) => (
                                                        <tr key={idx} className={idx % 2 === 0 ? 'bg-plant-bg/30' : ''}>
                                                            <td className="px-3 py-1.5">{row[0]?.slice(0, 15) || '-'}</td>

                return hourlyData.map(item => ({

                    .filter(log => log.time && log.time !== "00:00" && log.plant_power > 0)
                    .sort((a, b) => {
                        // Try to sort by original timestamp if available
                        const timeA = hourlyData.find(h => parseTime(h.Timestamp) === a.time)?.Timestamp;
                        const timeB = hourlyData.find(h => parseTime(h.Timestamp) === b.time)?.Timestamp;
                        
                        if (timeA && timeB) {
                            return new Date(timeA) - new Date(timeB);
                        }
                        return a.time.localeCompare(b.time);

                    .filter(log => log.Timestamp && !log.Timestamp.includes('Invalid'))

            const [lastUpdate, setLastUpdate] = useState(null);
            
            // Data State
            const [dailyData, setDailyData] = useState([]);
            const [hourlyData, setHourlyData] = useState([]);
            
            useEffect(() => {
                const checkFirebase = () => { 
                    if (window.firebaseModules) setFirebaseReady(true); 
                };
                window.addEventListener('firebase-ready', checkFirebase);
                checkFirebase();
                return () => window.removeEventListener('firebase-ready', checkFirebase);
            }, []);
            
            useEffect(() => {
                if (!user || !firebaseReady || !authenticated) {
                    setIsLoading(true);
                    return;
                }
                
                const { getFirestore, collection, onSnapshot, query, orderBy } = window.firebaseModules;
                const db = getFirestore();
                let dailyUnsub, hourlyUnsub;
                let initialLoad = true;
                
                try {
                    // Set up subscription for daily production data
                    dailyUnsub = onSnapshot(
                        collection(db, "RP_Daily_Report"), 
                        (snapshot) => {
                            const newData = [];
                            snapshot.forEach(doc => {
                                const data = doc.data();
                                if (data.Parameter && data.Parameter.trim() !== '') {
                                    newData.push(data);
                                }
                            });
                            
                            setDailyData(newData);
                            
                            // Only set loading to false after first data load
                            if (initialLoad && newData.length > 0) {
                                setIsLoading(false);
                                initialLoad = false;
                                setLastUpdate(new Date());
                            }
                        },
                        (error) => {
                            console.error("Error fetching daily data:", error);
                            setIsLoading(false);
                        }
                    );
                    
                    // Set up subscription for hourly trend data
                    hourlyUnsub = onSnapshot(
                        query(collection(db, "RP_Hourly_Trends"), orderBy('Timestamp', 'desc')),
                        (snapshot) => {
                            const logs = [];
                            snapshot.forEach(doc => {
                                const data = doc.data();
                                if (data.Timestamp && !data.Timestamp.includes('Resize')) {
                                    logs.push(data);
                                }
                            });
                            setHourlyData(logs);
                        },
                        (error) => {
                            console.error("Error fetching hourly data:", error);
                        }
                    );
                    
                } catch (error) {
                    console.error("Error setting up Firestore listeners:", error);
                    setIsLoading(false);
                }
                
                return () => {
                    if (dailyUnsub) dailyUnsub();
                    if (hourlyUnsub) hourlyUnsub();
                };
            }, [user, firebaseReady, authenticated]);
            
            const handleRefresh = () => {
                setIsLoading(true);
                // Force re-subscription by re-initializing state
                setDailyData([]);
                setHourlyData([]);
                // Firebase will automatically re-fetch data due to the onSnapshot listeners
            };
            
            const handleLogout = () => {
                try { 
                    localStorage.removeItem('rpcm_auth_data'); 
                    sessionStorage.removeItem('rpcm_authenticated'); 
                } catch(e){}
                setAuthenticated(false);
            };
            
            const handleLogin = (remember) => {
                try {
                    if (remember) {
                        localStorage.setItem('rpcm_auth_data', JSON.stringify({ 
                            timestamp: Date.now(),
                            version: '1.0'
                        }));
                    } else {
                        sessionStorage.setItem('rpcm_authenticated', 'true');
                    }
                } catch(e){}
                setAuthenticated(true);
                // Reset loading state to show skeleton while fetching fresh data
                setIsLoading(true);
            };
            
            if (!authenticated) return <PasswordGate onLogin={handleLogin} />;
            
            return (
                <div className="min-h-screen bg-plant-bg text-slate-200 selection:bg-accent-primary selection:text-white">
                    <Sidebar activeTab={activeTab} onTabChange={setActiveTab} onLogout={handleLogout} />
                    <BottomNav activeTab={activeTab} onTabChange={setActiveTab} />
                    
                    {activeTab === 'dashboard' && (
                        <Dashboard 
                            dailyData={dailyData} 
                            hourlyData={hourlyData}
                            isLoading={isLoading}
                            onRefresh={handleRefresh}
                        />
                    )}
                    
                    {activeTab === 'logs' && (
                        <HourlyLogs
                            hourlyData={hourlyData}
                            isLoading={isLoading}
                            onRefresh={handleRefresh}
                        />
                    )}
                    
                    {activeTab === 'settings' && <Settings user={user} db={null} />}
                </div>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        class SafeRoot extends React.Component {
            state = { hasError: false, error: null };
            static getDerivedStateFromError(error) { 
                return { hasError: true, error }; 
            }
            componentDidCatch(error, errorInfo) {
                console.error("App crashed:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) return (
                    <div className="min-h-screen bg-plant-bg flex items-center justify-center text-center p-4">
                        <div className="glass-panel p-8 rounded-2xl max-w-md w-full">
                            <div className="flex justify-center mb-4">
                                <div className="w-16 h-16 bg-status-crit/20 rounded-full flex items-center justify-center text-status-crit">
                                    <Icon name="AlertTriangle" size={32} />
                                </div>
                            </div>
                            <h2 className="text-2xl font-bold text-white mb-2">Application Error</h2>
                            <p className="text-gray-400 mb-6">The dashboard encountered an unexpected error.</p>
                            <div className="bg-plant-bg/50 border border-status-crit/30 rounded-lg p-4 mb-6 text-left text-sm text-gray-300 overflow-auto max-h-40">
                                <p>{this.state.error?.message || 'Unknown error occurred'}</p>
                            </div>
                            <button 
                                onClick={() => { 
                                    localStorage.clear(); 
                                    sessionStorage.clear(); 
                                    window.location.reload(); 
                                }} 
                                className="bg-status-crit hover:bg-red-600 text-white px-6 py-3 rounded-lg font-medium transition-colors flex items-center gap-2 mx-auto"
                            >
                                <Icon name="RefreshCw" size={18} />
                                Reset Application
                            </button>
                        </div>
                    </div>
                );
                return this.props.children;
            }
        }
        
        // Render the application
        root.render(
            <SafeRoot>
                <React.StrictMode>
                    <App />
                </React.StrictMode>
            </SafeRoot>
        );
    </script>
</body>
</html>
