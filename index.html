    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .metric-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        input[type="file"]::file-selector-button {
            background-color: #334155;
            color: #e2e8f0;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            margin-right: 1rem;

        input[type="file"]::file-selector-button:hover { background-color: #475569; }
        .custom-checkbox { accent-color: #3b82f6; }
        .chart-tooltip {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px;
            color: #f1f5f9;
        }
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .time-badge {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;
        const {

        } = Recharts;
        
        // --- Configuration ---
        const firebaseConfig = {

        // --- Icons ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {

                LayoutDashboard: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
                Table2: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>,
                Settings: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
                Upload: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
                LogOut: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
                Fuel: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 22v-8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8"/><path d="M8 12V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v8"/></svg>,
                Calendar: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
                AlertTriangle: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r="1"/></svg>,
                RefreshCw: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
            };
            return icons[name] || icons.Activity;
        };
        
        // --- Helper Functions ---
        const formatNumber = (value, decimals = 2) => {
            if (value === null || value === undefined || value === '') return '-';
            if (typeof value === 'string' && (value.includes('No Good Data') || value.includes('Bad') || value.includes('Resize'))) return '-';
            
            let num = parseFloat(value);
            if (isNaN(num)) return '-';
            
            return num.toFixed(decimals);
        };
        
        const parseTime = (timeStr) => {
            if (!timeStr) return "No time data";
            
            // Handle timestamp format: "DD/MM/YYYY h AM/PM"
            if (timeStr.includes('/') && (timeStr.includes('AM') || timeStr.includes('PM'))) {
                try {
                    // Split the timestamp string
                    const [datePart, timePart, ampmPart] = timeStr.split(' ');
                    
                    // Parse date part
                    const [day, month, year] = datePart.split('/');
                    
                    // Parse time part 
                    let hour = parseInt(timePart);
                    if (ampmPart === 'PM' && hour < 12) hour += 12;
                    if (ampmPart === 'AM' && hour === 12) hour = 0;
                    
                    // Create a date object
                    const date = new Date(`${month}/${day}/${year} ${hour}:19:00`);
                    
                    // Format as "Nov 28, 09:10 PM"
                    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const monthAbbr = monthNames[date.getMonth()];
                    const dayNum = date.getDate();
                    const timeStr = date.toLocaleTimeString('en-US', { 
                        hour: '2-digit', 
                        minute: '2-digit',
                        hour12: true 
                    });
                    
                    return `${monthAbbr} ${dayNum}, ${timeStr}`;
                } catch (e) {
                    console.error("Error parsing timestamp:", e);
                }
            }
            
            // Handle full datetime format: "2025-11-27 14:20:44.890000"
            if (timeStr.includes('-') && timeStr.includes(':')) {
                try {
                    const date = new Date(timeStr);
                    if (!isNaN(date.getTime())) {
                        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                        const monthAbbr = monthNames[date.getMonth()];
                        const dayNum = date.getDate();
                        const timeStr = date.toLocaleTimeString('en-US', { 
                            hour: '2-digit', 
                            minute: '2-digit',
                            hour12: true 
                        });
                        
                        return `${monthAbbr} ${dayNum}, ${timeStr}`;
                    }
                } catch (e) {
                    console.error("Error parsing datetime:", e);
                }
            }
            
            // Fallback formatting
            if (timeStr.includes('AM') || timeStr.includes('PM')) {
                // Extract time part for fallback
                const timeMatch = timeStr.match(/(\d{1,2}:\d{2})\s*(AM|PM)/i);
                if (timeMatch) {
                    const today = new Date();
                    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const monthAbbr = monthNames[today.getMonth()];
                    const dayNum = today.getDate();
                    return `${monthAbbr} ${dayNum}, ${timeMatch[1]} ${timeMatch[2]}`;
                }
            }
            
            // Final fallback: use today's date with the time string
            const now = new Date();
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const monthAbbr = monthNames[now.getMonth()];
            const dayNum = now.getDate();
            return `${monthAbbr} ${dayNum}, ${timeStr}`;
        };
        
        // --- Components ---
        const StatCard = ({ title, value, unit, target, icon, loading = false }) => {
            if (loading) {
                return (
                    <div className="metric-card rounded-xl p-5 skeleton"></div>
                );
            }
            
            // Determine status color based on value vs target
            let statusColor = 'text-gray-400';
            const numValue = parseFloat(value);
            const numTarget = parseFloat(target);
            
            if (!isNaN(numValue) && !isNaN(numTarget)) {
                if (title.includes('Availability') || title.includes('Recovery')) {
                    // Higher is better
                    if (numValue >= numTarget) statusColor = 'text-status-ok';
                    else if (numValue >= numTarget * 0.9) statusColor = 'text-status-warn';
                    else statusColor = 'text-status-crit';
                } else {
                    // Lower is better (consumption metrics)
                    if (numValue <= numTarget) statusColor = 'text-status-ok';
                    else if (numValue <= numTarget * 1.1) statusColor = 'text-status-warn';
                    else statusColor = 'text-status-crit';
                }
            }
            
            return (
                <div className="metric-card rounded-xl p-5 relative overflow-hidden group">
                    <div className="absolute top-0 right-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity">
                        <Icon name={icon} size={60} />
                    </div>
                    <div className="relative z-10">
                        <div className="text-sm text-gray-400 font-medium mb-1 flex items-center gap-2">
                            <Icon name={icon} size={16} className="text-accent-primary" />
                            {title}
                        </div>
                        <div className="flex items-end gap-2">
                            <span className="text-2xl font-bold text-white">{formatNumber(value)}</span>
                            {unit && <span className="text-xs text-gray-500 mb-1">{unit}</span>}
                        </div>
                        {target && (
                            <div className="mt-2 pt-2 border-t border-white/5 flex justify-between items-center text-xs">
                                <span className="text-gray-500 flex items-center">
                                    <span className={`status-indicator ${statusColor.replace('text-', 'bg-')}`}></span>
                                    Target: {formatNumber(target)}
                                </span>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        
        const PasswordGate = ({ onLogin }) => {
            const [password, setPassword] = useState('');
            const [remember, setRemember] = useState(false);
            const [error, setError] = useState(false);
            const [showPassword, setShowPassword] = useState(false);
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (password === 'rpcm2024') { 
                    onLogin(remember);
                    setError(false);
                } else {
                    setError(true);
                    setPassword('');
                }
            };
            
            return (
                <div className="min-h-screen flex items-center justify-center bg-plant-bg p-4">
                    <div className="glass-panel p-8 rounded-2xl w-full max-w-md relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-accent-primary to-accent-secondary"></div>
                        <div className="flex justify-center mb-6">
                            <div className="w-16 h-16 bg-accent-primary/20 rounded-2xl flex items-center justify-center text-accent-primary">
                                <Icon name="Factory" size={32} />
                            </div>
                        </div>
                        <h1 className="text-2xl font-bold text-center mb-2 text-white">RPCM Monitor</h1>
                        <p className="text-gray-400 text-center mb-8 text-sm">Secure Access Portal</p>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div className="relative">
                                <input
                                    type={showPassword ? "text" : "password"}
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    placeholder="Access Code"
                                    className="w-full bg-plant-bg border border-plant-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-accent-primary transition-colors placeholder-gray-600"
                                    autoFocus
                                />
                                <button
                                    type="button"
                                    onClick={() => setShowPassword(!showPassword)}
                                    className="absolute right-3 top-3 text-gray-400 hover:text-white transition-colors"
                                    aria-label={showPassword ? "Hide password" : "Show password"}
                                >
                                    <Icon name={showPassword ? "EyeOff" : "Eye"} size={18} />
                                </button>
                            </div>
                            <div className="flex items-center">
                                <input 
                                    id="remember-me" 
                                    type="checkbox" 
                                    checked={remember}
                                    onChange={(e) => setRemember(e.target.checked)}
                                    className="w-4 h-4 text-accent-primary bg-gray-700 border-gray-600 rounded focus:ring-accent-primary focus:ring-2 custom-checkbox cursor-pointer" 
                                />
                                <label htmlFor="remember-me" className="ml-2 text-sm font-medium text-gray-400 cursor-pointer select-none">Keep me logged in (30 days)</label>
                            </div>
                            {error && <p className="text-status-crit text-sm text-center bg-status-crit/10 py-2 rounded">Invalid credential provided</p>}
                            <button type="submit" className="w-full bg-accent-primary hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-blue-900/20">
                                Enter Dashboard
                            </button>
                        </form>
                    </div>
                </div>
            );
        };
        
        const Dashboard = ({ dailyData, hourlyData, isLoading, onRefresh, loadError }) => {
            const [chartHours, setChartHours] = useState(12);
            
            const getVal = (paramName) => {
                if (isLoading) return '0';
                const item = dailyData[paramName];
                return item ? item.Actual : '0';
            };
            
            const getTarget = (paramName) => {
                if (isLoading) return '0';
                const item = dailyData[paramName];
                return item ? item.Target : '0';
            };
            
            const getUnit = (paramName) => {
                if (isLoading) return '';
                const item = dailyData[paramName];
                return item ? item.Unit : '';
            };
            
            // Process and format hourly data
            const processedHourlyData = useMemo(() => {
                return hourlyData.map(item => ({
                    time: parseTime(item.Timestamp),
                    plant_power: item.Plant_Power || 0,
                    stg_gen: item.STG_Power || 0,
                    original_time: item.Timestamp
                }));
            }, [hourlyData]);
            
            // Limit the chart to the specified number of hours
            const chartData = useMemo(() => {
                if (!processedHourlyData || processedHourlyData.length === 0) return [];
                
                // Filter and sort hourly data
                return processedHourlyData
                    .filter(log => log.time && log.time !== "00:00" && log.plant_power > 0)
                    .sort((a, b) => {
                        try {
                            // Try to sort by the original timestamp
                            if (a.original_time.includes('/') && (a.original_time.includes('AM') || a.original_time.includes('PM'))) {
                                const dateA = new Date(a.original_time.replace(' AM', '').replace(' PM', ''));
                                const dateB = new Date(b.original_time.replace(' AM', '').replace(' PM', ''));
                                return dateB - dateA; // Most recent first
                            }
                            return parseTime(a.original_time).localeCompare(parseTime(b.original_time));
                        } catch (e) {
                            // Fallback to string comparison
                            return a.time.localeCompare(b.time);
                        }
                    })
                    .slice(0, chartHours); // Get the most recent entries
            }, [processedHourlyData, chartHours]);
            
            const latestTime = useMemo(() => {
                if (isLoading) return "Loading...";
                if (!hourlyData || hourlyData.length === 0) return "No recent data";
                
                // Get the most recent valid timestamp
                const validLogs = hourlyData
                    .filter(log => log.Timestamp && !log.Timestamp.includes('Invalid'))
                    .sort((a, b) => {
                        try {
                            if (a.Timestamp.includes('/') && (a.Timestamp.includes('AM') || a.Timestamp.includes('PM'))) {
                                const dateA = new Date(a.Timestamp.replace(' AM', '').replace(' PM', ''));
                                const dateB = new Date(b.Timestamp.replace(' AM', '').replace(' PM', ''));
                                return dateB - dateA;
                            }
                            return b.Timestamp.localeCompare(a.Timestamp);
                        } catch (e) {
                            return b.Timestamp.localeCompare(a.Timestamp);
                        }
                    });
                
                if (validLogs.length === 0) return "No valid hourly data";
                
                const lastLog = validLogs[0];
                return parseTime(lastLog.Timestamp) || "Unknown time";
            }, [hourlyData, isLoading]);
            
            const CustomTooltip = ({ active, payload, label }) => {
                if (!active || !payload || payload.length === 0) return null;
                
                return (
                    <div className="chart-tooltip">
                        <p className="font-bold mb-1">{label}</p>
                        {payload.map((entry, index) => (
                            <p key={index} className="text-sm" style={{ color: entry.color }}>
                                {entry.name}: {parseFloat(entry.value).toFixed(2)} MW
                            </p>
                        ))}
                    </div>
                );
            };
            
            if (loadError) {

        const HourlyLogs = ({ hourlyData, isLoading, onRefresh, loadError }) => {
            // Filter and sort hourly data for display
            const sortedLogs = useMemo(() => {
                if (!hourlyData || hourlyData.length === 0) return [];
                
                return [...hourlyData]
                    .filter(log => log.Timestamp && !log.Timestamp.includes('Invalid'))
                    .sort((a, b) => {
                        try {
                            // Parse the timestamp for proper sorting
                            if (a.Timestamp.includes('/') && (a.Timestamp.includes('AM') || a.Timestamp.includes('PM'))) {
                                const dateA = new Date(a.Timestamp.replace(' AM', '').replace(' PM', ''));
                                const dateB = new Date(b.Timestamp.replace(' AM', '').replace(' PM', ''));
                                return dateB - dateA; // Most recent first
                            }
                            return b.Timestamp.localeCompare(a.Timestamp);
                        } catch (e) {
                            // Fallback to string comparison if parsing fails
                            return b.Timestamp.localeCompare(a.Timestamp);
                        }
                    })
                    .map(log => ({
                        time: parseTime(log.Timestamp),
                        plant_power: log.Plant_Power || 0,
                        stg_gen: log.STG_Power || 0,
                        original_timestamp: log.Timestamp

                                    {sortedLogs.length > 0 ? (

        // Main App Component
        const App = () => {
            // Safe Auth Logic
            const [authenticated, setAuthenticated] = useState(() => {
                try {
                    const stored = localStorage.getItem('rpcm_auth_data');
                    if (stored) {
                        const { timestamp } = JSON.parse(stored);
                        if (Date.now() - timestamp < 2592000000) return true;
                    }
                    return !!sessionStorage.getItem('rpcm_authenticated');
                } catch { return false; }
            });
            
            const [activeTab, setActiveTab] = useState('dashboard');
            const [user, setUser] = useState(null);
            const [firebaseReady, setFirebaseReady] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(null);
            const [lastUpdate, setLastUpdate] = useState(null);
            
            // Data State
            const [dailyData, setDailyData] = useState({});
            const [hourlyData, setHourlyData] = useState([]);
            
            useEffect(() => {
                console.log("Setting up Firebase listeners");
                const checkFirebase = () => { 
                    if (window.firebaseModules) setFirebaseReady(true); 
                };
                window.addEventListener('firebase-ready', checkFirebase);
                checkFirebase();
                return () => window.removeEventListener('firebase-ready', checkFirebase);
            }, []);
            
            useEffect(() => {
                let authTimeout;
                
                if (!firebaseReady) return;
                
                console.log("Initializing Firebase authentication");
                const { initializeApp, getApps, getAuth, signInAnonymously, onAuthStateChanged } = window.firebaseModules;
                try {
                    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
                    const auth = getAuth(app);
                    
                    // Sign in anonymously
                    signInAnonymously(auth).catch(console.error);
                    
                    const unsubscribe = onAuthStateChanged(auth, (u) => {
                        console.log("Auth state changed:", u ? "logged in" : "not logged in");
                        setUser(u);
                        
                        // If authenticated but no user, try again after delay
                        if (!u) {
                            authTimeout = setTimeout(() => {
                                console.log("Re-attempting anonymous sign-in");
                                signInAnonymously(auth).catch(console.error);
                            }, 5000);
                        }
                    });
                    
                    return () => {
                        unsubscribe();
                        if (authTimeout) clearTimeout(authTimeout);
                    };
                } catch (e) { 
                    console.error("Auth Error", e); 
                    setLoadError({ message: "Authentication failed: " + e.message });
                    // Retry after delay
                    authTimeout = setTimeout(() => {
                        window.location.reload();
                    }, 10000);
                    return () => clearTimeout(authTimeout);
                }
            }, [firebaseReady]);
            
            useEffect(() => {
                if (!user || !firebaseReady || !authenticated) {
                    setIsLoading(true);
                    return;
                }
                
                console.log("Setting up Firestore listeners");
                setLoadError(null);
                setIsLoading(true);
                
                const { getFirestore, collection, doc, onSnapshot, query, orderBy } = window.firebaseModules;
                const db = getFirestore();
                let dailyUnsub, hourlyUnsub;
                let initialLoad = true;
                
                try {
                    // Set up subscription for daily data
                    console.log("Subscribing to RP_Daily_Report/Daily_Snapshot document");
                    const dailyDocRef = doc(db, "RP_Daily_Report", "Daily_Snapshot");
                    
                    dailyUnsub = onSnapshot(
                        dailyDocRef,
                        (doc) => {
                            console.log("Received daily data document");
                            if (doc.exists()) {
                                const data = doc.data();
                                // Extract the nested parameter data
                                const params = {};
                                Object.keys(data).forEach(key => {
                                    if (key !== 'last_updated' && typeof data[key] === 'object' && data[key] !== null) {
                                        params[key] = data[key];
                                    }
                                });
                                
                                setDailyData(params);
                                
                                // Only set loading to false after first data load
                                if (initialLoad) {
                                    console.log("Initial daily data load complete");
                                    setIsLoading(false);
                                    initialLoad = false;
                                    setLastUpdate(new Date());
                                }
                            } else {
                                console.log("Daily_Snapshot document does not exist yet");
                                if (initialLoad) {
                                    setIsLoading(false);
                                    initialLoad = false;
                                }
                            }
                        },
                        (error) => {
                            console.error("Error fetching daily data:", error);
                            setLoadError({ message: "Error loading daily data: " + error.message });
                            setIsLoading(false);
                        }
                    );
                    
                    // Set up subscription for hourly trends
                    console.log("Subscribing to RP_Daily_Report/Daily_Snapshot/RP_Hourly_Trends collection");
                    const hourlyCollectionRef = collection(dailyDocRef, "RP_Hourly_Trends");
                    
                    hourlyUnsub = onSnapshot(
                        query(hourlyCollectionRef, orderBy('Timestamp', 'desc')),
                        (snapshot) => {
                            console.log(`Received ${snapshot.size} documents for hourly trends`);
                            const logs = [];
                            snapshot.forEach(doc => {
                                const data = doc.data();
                                if (data.Timestamp) {
                                    logs.push(data);
                                }
                            });
                            setHourlyData(logs);
                        },
                        (error) => {
                            console.error("Error fetching hourly trends:", error);
                            setLoadError({ message: "Error loading hourly data: " + error.message });
                        }
                    );
                    
                } catch (error) {
                    console.error("Error setting up Firestore listeners:", error);
                    setLoadError({ message: "Error setting up data listeners: " + error.message });
                    setIsLoading(false);
                }
                
                return () => {
                    console.log("Cleaning up Firestore listeners");
                    if (dailyUnsub) dailyUnsub();
                    if (hourlyUnsub) hourlyUnsub();
                };
            }, [user, firebaseReady, authenticated]);
            
            const handleRefresh = () => {
                console.log("Manual refresh triggered");
                setLoadError(null);
                setIsLoading(true);
                // Force re-subscription by re-initializing state
                setDailyData({});
                setHourlyData([]);
                // Firestore will automatically re-fetch data due to the onSnapshot listeners
            };
            
            const handleLogout = () => {
                console.log("User logging out");
                try { 
                    localStorage.removeItem('rpcm_auth_data'); 
                    sessionStorage.removeItem('rpcm_authenticated'); 
                } catch(e){}
                setAuthenticated(false);
            };
            
            const handleLogin = (remember) => {
                console.log("User logging in, remember:", remember);
                try {
                    if (remember) {
                        localStorage.setItem('rpcm_auth_data', JSON.stringify({ 
                            timestamp: Date.now(),
                            version: '1.0'
                        }));
                    } else {
                        sessionStorage.setItem('rpcm_authenticated', 'true');
                    }
                } catch(e){}
                setAuthenticated(true);
                // Reset loading state to show skeleton while fetching fresh data
                setIsLoading(true);
                setLoadError(null);
            };
            
            if (!authenticated) {
                console.log("Showing password gate");
                return <PasswordGate onLogin={handleLogin} />;
            }
            
            return (
                <div className="min-h-screen bg-plant-bg text-slate-200 selection:bg-accent-primary selection:text-white">
                    <Sidebar activeTab={activeTab} onTabChange={setActiveTab} onLogout={handleLogout} />
                    <BottomNav activeTab={activeTab} onTabChange={setActiveTab} />
                    
                    {activeTab === 'dashboard' && (
                        <Dashboard 
                            dailyData={dailyData} 
                            hourlyData={hourlyData}
                            isLoading={isLoading}
                            onRefresh={handleRefresh}
                            loadError={loadError}
                        />
                    )}
                    
                    {activeTab === 'logs' && (
                        <HourlyLogs
                            hourlyData={hourlyData}
                            isLoading={isLoading}
                            onRefresh={handleRefresh}
                            loadError={loadError}
                        />
                    )}
                    
                    {activeTab === 'settings' && (
                        <div className="p-4 md:p-6 md:ml-64 text-white min-h-screen">
                            <h1 className="text-2xl md:text-3xl font-bold mb-6">System Information</h1>
                            <div className="glass-panel p-6 rounded-2xl">
                                <h2 className="text-xl font-bold mb-4">Firestore Data Structure</h2>
                                <div className="space-y-4">
                                    <div className="p-4 bg-plant-bg/50 rounded-lg">
                                        <h3 className="font-medium mb-2">Current Document Path</h3>
                                        <p className="text-sm text-gray-300">RP_Daily_Report/Daily_Snapshot</p>
                                        <p className="text-xs text-gray-400 mt-1">Subcollection: RP_Hourly_Trends</p>
                                    </div>
                                    <div className="p-4 bg-plant-bg/50 rounded-lg">
                                        <h3 className="font-medium mb-2">Data Flow</h3>
                                        <ol className="list-decimal list-inside text-sm text-gray-300 space-y-1">
                                            <li>PI Datalink exports data to <code>RP_Prod_Report.xlsx</code></li>
                                            <li>Python script processes and uploads to Firestore</li>
                                            <li>Dashboard fetches data from the correct Firestore path</li>
                                        </ol>
                                    </div>
                                    <div className="p-4 bg-plant-bg/50 rounded-lg">
                                        <h3 className="font-medium mb-2">Troubleshooting</h3>
                                        <ul className="list-disc list-inside text-sm text-gray-300 space-y-1">
                                            <li>Ensure Python script is running successfully</li>
                                            <li>Check Firebase console for document existence</li>
                                            <li>Verify service account permissions</li>
                                            <li>Use browser dev tools to check for errors</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        class SafeRoot extends React.Component {
            state = { hasError: false, error: null, errorInfo: null };
            static getDerivedStateFromError(error) { 
                return { hasError: true, error }; 
            }
            componentDidCatch(error, errorInfo) {
                console.error("App crashed:", error, errorInfo);
                this.setState({ errorInfo: errorInfo });
            }
            render() {
                if (this.state.hasError) return (
                    <div className="min-h-screen bg-plant-bg flex items-center justify-center text-center p-4">
                        <div className="glass-panel p-8 rounded-2xl max-w-md w-full">
                            <div className="flex justify-center mb-4">
                                <div className="w-16 h-16 bg-status-crit/20 rounded-full flex items-center justify-center text-status-crit">
                                    <Icon name="AlertTriangle" size={32} />
                                </div>
                            </div>
                            <h2 className="text-2xl font-bold text-white mb-2">Application Error</h2>
                            <p className="text-gray-400 mb-6">The dashboard encountered an unexpected error.</p>
                            <div className="bg-plant-bg/50 border border-status-crit/30 rounded-lg p-4 mb-6 text-left text-sm text-gray-300 overflow-auto max-h-40">
                                <p>{this.state.error?.message || 'Unknown error occurred'}</p>
                                {this.state.errorInfo && <p className="mt-2 text-xs text-gray-500">Component stack: {this.state.errorInfo.componentStack}</p>}
                            </div>
                            <button 
                                onClick={() => { 
                                    localStorage.clear(); 
                                    sessionStorage.clear(); 
                                    window.location.reload(); 
                                }} 
                                className="bg-status-crit hover:bg-red-600 text-white px-6 py-3 rounded-lg font-medium transition-colors flex items-center gap-2 mx-auto"
                            >
                                <Icon name="RefreshCw" size={18} />
                                Reset Application
                            </button>
                        </div>
                    </div>
                );
                return this.props.children;
            }
        }
        
        // Render the application
        console.log("Starting app render");
        root.render(
            <SafeRoot>
                <React.StrictMode>
                    <App />
                </React.StrictMode>
            </SafeRoot>
        );
    </script>
</body>
</html>
